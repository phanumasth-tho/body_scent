<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการคำสั่งซื้อ — Body Scent Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Styling สำหรับตาราง Admin ให้ดูสะอาดและอ่านง่าย */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    .admin-table th {
      padding: 16px 20px;
      background-color: var(--bg-secondary);
      color: var(--text-main);
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-weight: 500;
      border-bottom: 1px solid var(--border-medium);
      white-space: nowrap;
    }

    .admin-table td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-main);
      vertical-align: top;
    }

    .admin-table tbody tr:hover {
      background-color: var(--bg-primary);
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <div class="container navbar">
      <a href="index.html" class="logo">Body Scent <span style="font-size: 0.75rem; color: var(--accent-gold); letter-spacing: 0.1em; margin-left: 8px;">ADMIN</span></a>
      <nav>
        <a href="index.html" class="btn btn-outline" style="padding: 8px 20px; font-size: 0.75rem;">ไปที่หน้าเว็บ</a>
      </nav>
    </div>
  </header>

  <main class="container section-padding">
    <div class="text-center" style="margin-bottom: 40px;">
      <h1 class="section-title">Order Dashboard</h1>
      <p>รายการคำสั่งซื้อทั้งหมดที่ส่งเข้ามาจากหน้าเว็บไซต์</p>
    </div>

    <!-- Table Container (script.js จะเติม tr เข้าใน tbody) -->
    <div class="table-responsive">
      <table id="ordersTable" class="admin-table">
        <thead>
          <tr>
            <th style="width: 15%;">วันเวลา</th>
            <th style="width: 15%;">ชื่อลูกค้า</th>
            <th style="width: 15%;">เบอร์โทร/Line</th>
            <th style="width: 25%;">รายการสินค้า</th>
            <th style="width: 10%;">จำนวนเงินรวม</th>
            <th style="width: 20%;">หมายเหตุ</th>
          </tr>
        </thead>
        <tbody>
          <!-- script.js จะดึงข้อมูล CSV มาใส่ให้อัตโนมัติ -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Footer -->
  <footer style="padding: 40px 0; border-top: 1px solid var(--border-light); text-align: center; font-size: 0.8rem; color: var(--text-light);">
    <div class="container">
      <p>&copy; 2026 Body Scent Admin System. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
