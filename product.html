<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สินค้าทั้งหมด — Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="container navbar">
      <a href="index.html" class="logo">Body Scent</a>
      <nav>
        <a href="index.html" class="btn btn-outline" style="padding: 8px 20px; font-size: 0.75rem;">หน้าแรก</a>
      </nav>
    </div>
  </header>

  <main class="container section-padding">
    <!-- หัวข้อหน้า -->
    <div class="text-center" style="margin-bottom: 40px;">
      <h1 class="section-title">Our Products</h1>
      <p>ค้นพบกลิ่นหอมที่สะท้อนตัวตนในแบบที่คุณเป็น</p>
    </div>

    <!-- div id="filter-bar" (สำหรับปุ่มกรอง โดยให้ script.js จัดการ) -->
    <div id="filter-bar" class="filter-tabs">
      <button class="filter-btn active" data-mood="all">ทั้งหมด</button>
      <button class="filter-btn" data-mood="fresh">
        <span class="mood-dot fresh"></span>Fresh
      </button>
      <button class="filter-btn" data-mood="relax">
        <span class="mood-dot sweet"></span>Relax
      </button>
      <button class="filter-btn" data-mood="focus">
        <span class="mood-dot confident"></span>Focus
      </button>
      <button class="filter-btn" data-mood="romance">
        <span class="mood-dot romance"></span>Romance
      </button>
    </div>

    <!-- div id="product-list" (สำหรับการ์ดสินค้า โดยให้ script.js เติมเนื้อหา) -->
    <div id="product-list" class="product-grid"></div>
  </main>

  <!-- Footer -->
  <footer style="padding: 40px 0; border-top: 1px solid var(--border-light); text-align: center; font-size: 0.8rem; color: var(--text-light);">
    <div class="container">
      <p>&copy; 2026 Body Scent. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
